name: build-sagit-droidspaces-22.2

# Xiaomi Mi 6 (sagit) / MSM8998 / LineageOS 22.2 / Linux 4.4.302 (non-GKI)
# Builds from the DroidSpaces kernel FORK: andyfriday105/android_kernel_xiaomi_msm8998 @ droidspaces-22.2
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-sagit.yml'
      - 'config/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod lz4 xz-utils device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch DroidSpaces kernel fork (andyfriday105 @ droidspaces-22.2)
        run: |
          set -e
          git clone -q --depth 1 -b droidspaces-22.2 \
            https://github.com/andyfriday105/android_kernel_xiaomi_msm8998.git k
          cd k
          git log --oneline -1 | tee ../kernel-commit.txt
          grep -m1 '^SUBLEVEL' Makefile | tee -a ../kernel-commit.txt
          # confirm the committed DroidSpaces cgroup hunk is present
          grep -q 'CFTYPE_NO_PREFIX' kernel/cgroup.c && echo "cgroup patch present (from fork)"
          sed -i 's|res="$res${scm:++}"|res="$res"|' scripts/setlocalversion || true

      - name: Fetch Proton clang 13
        run: |
          set -e
          git clone -q --depth 1 -b clang-13 https://gitlab.com/LeCmnGend/proton-clang.git clang
          clang/bin/clang --version

      - name: Configure (fork sagit_defconfig + droidspaces.config)
        run: |
          set -e
          cd k
          export PATH="$PWD/../clang/bin:$PATH"
          MK="O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          make $MK sagit_defconfig
          cat droidspaces.config >> out/.config
          scripts/config --file out/.config -d CC_WERROR
          scripts/config --file out/.config -d LOCALVERSION_AUTO
          scripts/config --file out/.config --set-str LOCALVERSION "-perf"
          make $MK olddefconfig
          echo "=== key options ==="
          for o in SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS NET_NS USER_NS DEVTMPFS OVERLAY_FS CGROUPS MEMCG MEMCG_SWAP CFS_BANDWIDTH CGROUP_PIDS CGROUP_DEVICE CGROUP_CPUACCT SECCOMP_FILTER VETH BRIDGE MACVLAN NF_TABLES IP6_NF_NAT IP6_NF_TARGET_MASQUERADE NETFILTER_XT_MATCH_ADDRTYPE MACH_SAGIT BUILD_ARM64_APPENDED_DTB_IMAGE; do
            line=$(grep -E "^(# )?CONFIG_${o}(=| is not set)" out/.config | head -1); echo "  $o -> ${line:-ABSENT}";
          done
          for o in SYSVIPC POSIX_MQUEUE PID_NS IPC_NS UTS_NS NET_NS USER_NS DEVTMPFS MEMCG MACH_SAGIT; do
            grep -q "^CONFIG_${o}=y" out/.config || { echo "::error::CONFIG_${o} missing"; exit 1; }
          done

      - name: Build Image.gz-dtb
        run: |
          set -e
          cd k
          export PATH="$PWD/../clang/bin:$PATH"
          export KBUILD_BUILD_USER=luvhx KBUILD_BUILD_HOST=Github-Action
          KCF="-Wno-error -Wno-unknown-warning-option -Wno-error=implicit-int -Wno-error=strict-prototypes -Wno-error=date-time -Wno-unused-variable"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="$KCF" Image.gz-dtb 2>&1 | tee ../build.log
          ls -l out/arch/arm64/boot/Image.gz-dtb
          python3 - <<'PYEOF'
          p='out/arch/arm64/boot/Image.gz-dtb'
          d=open(p,'rb').read()
          print('Image.gz-dtb size', len(d), 'head', d[:4].hex())
          assert d[:2]==bytes.fromhex('1f8b'), 'not gzip'
          assert bytes.fromhex('d00dfeed') in d, 'no FDT magic'
          print('OK: gzip kernel + appended FDT(s)')
          PYEOF

      - name: Repack official boot.img (mkboot.py)
        continue-on-error: true
        run: |
          set -e
          cd k
          BOOT_URL="${BOOT_URL:-https://mirrorbits.lineageos.org/full/sagit/20261106/boot.img}"
          curl -fL --retry 3 --connect-timeout 30 -o ../stock-boot.img "$BOOT_URL" || { echo "::warning::boot.img download failed; skip"; exit 0; }
          python3 ../scripts/mkboot.py info ../stock-boot.img || true
          python3 ../scripts/mkboot.py repack --orig ../stock-boot.img --kernel out/arch/arm64/boot/Image.gz-dtb --out ../boot-sagit-droidspaces.img
          python3 ../scripts/mkboot.py info ../boot-sagit-droidspaces.img || true
          sha256sum ../boot-sagit-droidspaces.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sagit-4.4.302-droidspaces
          path: |
            k/out/arch/arm64/boot/Image.gz-dtb
            k/out/.config
            k/out/System.map
            build.log
            kernel-commit.txt
            boot-sagit-droidspaces.img
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
